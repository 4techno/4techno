<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="180">
  <defs>
    <style>
      .bg { fill: #F6F4EE; stroke: #E5E0D5; stroke-width: 1px; rx: 2px; }
      .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 26px; font-weight: 600; fill: #1C1917; }
      .tagline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #8C4A2F; letter-spacing: 0.5px; text-transform: uppercase; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 14px; font-weight: 400; fill: #57534E; }
      .divider { stroke: #E5E0D5; stroke-width: 1px; }
      .meta-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #8C4A2F; text-transform: uppercase; letter-spacing: 0.5px; }
      .meta-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #1C1917; }
    </style>
  </defs>

  <rect width="880" height="180" class="bg" />

  <!-- Main heading block -->
  <text x="36" y="48" class="tagline">Engineering &amp; Software Development</text>
  <text x="36" y="80" class="name">Mohammed Vashir</text>
  <text x="36" y="106" class="desc">Building embedded firmware, robotics controllers, RF instrumentation, and full-stack web applications.</text>

  <line x1="36" y1="126" x2="844" y2="126" class="divider" />

  <!-- Metadata footer row -->
  <text x="36" y="152" class="meta-label">Primary Portfolio</text>
  <text x="36" y="168" class="meta-val">4tech Engineering Systems</text>

  <text x="290" y="152" class="meta-label">Core Implementation</text>
  <text x="290" y="168" class="meta-val">Python, TypeScript, Next.js, C++</text>

  <text x="590" y="152" class="meta-label">Focus Areas</text>
  <text x="590" y="168" class="meta-val">Hardware Integration, REST APIs, Automation</text>
</svg>
